<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CSS_Margin_Activity. </title>
    <style>
        p{
            border: 2px solid maroon;
            margin: 30px;
            padding: 10px;
            padding-top: 20px;
            padding-right: 40px;
            padding-bottom: 60px;
            padding-left: 80;
        }
        .first{
            border: 2px solid maroon;
            margin-top: 40px;
        }
        .second{
            border: 2px solid maroon;
            margin-bottom: 20px;
            margin-collapse
        }
        
    </style>
</head>
<body> 
    <h1>CSS Margin Activity</h1> 
    <p>This paragraph has a margin.</p>
    <pre class="first">This paragraph has a margin. 40px</pre>
    <pre class="second">his paragraph has a margin. 20px</pre>
</body>
</html>
