<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        body { 
            font-family: Arial, sans-serif; 
            margin: 24px; 
            background: #f7f3f4; 
            color: #222; 
        } 
        h1, h2 { color: maroon; } 

        ul.circle-list { list-style-type: circle; } 
        ul.square-list { list-style-type: square; } 
        ol.roman-list { list-style-type: upper-roman; } 
        ol.alpha-list { list-style-type: lower-alpha; }
        
        ul.outside-list { list-style-position: outside; } 
        ul.inside-list { list-style-position: inside; } 

        ul.image-list { 
            list-style-image: url(images/background.jpg); 
            list-style-type: square; 
        }

        ul.tech-list { 
            list-style: square inside; 
        }
        
        ul.tech-list { 
            list-style: square inside; 
            background: #f2dce2; 
            padding: 20px; 
        } 
        ul.tech-list-li { 
            background: #ffffff; 
            color: #5b0018; 
            padding: 8px; 
            margin: 6px 0; 
        } 

        .page-title { text-align: center; color: maroon; } 
        .topic-list { 
            list-style-type: square; 
            background: #f2dce2; 
            padding: 20px 36px; 
            border-radius: 10px; 
        } 
        .topic-list-li { 
            background: white; 
            color: #5b0018; 
            padding: 8px; 
            margin: 6px 0; 
        } 
        .steps-list { list-style-type: upper-roman; } 

</style> 
</head>
<body >
    <h1 class="page-title">Techpro ICT Checklist</h1>
    <ul class="topic-list"; >
        <li class="topic-list-li">learn how to use basic Html </li>
        <li class="topic-list-li">how to use h1 and P </li>
        <li class="topic-list-li">how to use Pre and br </li>
        <li class="topic-list-li">how to use CSS</li>
    </ul>
</body>
</html>
