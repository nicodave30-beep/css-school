<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project</title>
    <style>
        body { 
            margin: 0;
            font-family: Arial, sans-serif; line-height: 1.5;
        } 
        .container{
            display: flex;
            background-color: aqua;
        }
        .container div{
            background-color: darkblue;
            margin: 10px;
            padding: 50px;
            color: white;
            font-size: 24px;
        }
        .card { 
            flex: 1 1 220px;
            background: white; 
            border: 2px solid #7b1530; 
            padding: 18px; text-align: center; 
        } 
         .flex-container { 
            display: flex;
            flex-direction: row; 
            flex-wrap: wrap; 
            justify-content: space-evenly; 
            align-items: stretch; 
            gap: 15px; 
            background: #eee; 
            padding: 15px; 
            min-height: 180px; 
        }

    </style>
</head>
<body>
    <section class="flex-container">
        <article class="card">This is a Card</article>
    </section>
</body>
</html>
