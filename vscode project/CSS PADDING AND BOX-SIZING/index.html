<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS PADDING AND BOX-SIZING </title>
    <style>
        .box{
            border: 3px solid maroon ;
            padding-top: 10px;
            padding-right: 20px;
            padding-bottom: 30px;
            padding-left: 40px;
            padding: 10px 20px 30px 40px ;
        }
        .boxing{
            padding: 20px;
            padding: 20px 40px;
            padding: 10px 20 30px;
            padding: 10px 20px 30px 40px;
        }
        .bozing{
            width: 300px;
            padding: 25px;
            border: 5px solid maroon;
        }
        .boat{
            width: 300px ;
            padding: 25px;
            border: 5px solid maroon;
            box-sizing: border-box;
        }
    </style>
</head>
<body class="boat">
    <p>This paragraph has 20 pixels of padding. </p>
</body>
</html>
