<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{ color: maroon;}
        a:link{ color: darkgoldenrod;}
        a:visited{ color: pink;}
        a:hover{ color: maroon; background-color: white;}
        a:active{ color: deeppink;}
        .button-link{
            display: inline-block ; background-color:  maroon;
            padding: 12px 20px; text-align: center; text-decoration: dotted;
            border:  2px solid maroon; border-radius: 6px; margin: 6px;
        }
        .button-link:link, .button-link:visited { color: white; } 
        .button-link:hover, .button-link:active { background-color: white; color: maroon; } 
    </style>
</head>
<body>
    <h1>Test about link </h1>
    <p><a href="https://lichess.org">Play chess</a></p>
    <p class="button-link"><a href="https://lichess.org">This is a button</a></p>
    <p></p>
</body>
</html>
